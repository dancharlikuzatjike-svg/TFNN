name: Weekly market prices
# The TFNN market price agent: reads the newest weekly livestock price report from the
# Livestock and Livestock Products Board of Namibia and sends the auction prices to TFNN,
# where they wait on the admin Prices tab for approval.
# Needs two repository secrets:
#   ANTHROPIC_API_KEY - a Claude API key from platform.claude.com
#   CRON_SECRET       - the same value as CRON_SECRET on the Render service
on:
  schedule:
    - cron: '17 5 * * 4' # Thursdays, 07:17 Windhoek
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only show what would be sent (do not send to TFNN)'
        type: boolean
        default: true
jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read the weekly report and send prices to TFNN
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "ANTHROPIC_API_KEY is not set - skipping"; exit 0; fi
          if [ "$DRY_RUN" = "true" ]; then node tools/price-agent.js --dry-run; else node tools/price-agent.js; fi
