name: Daily task reminders
# Calls the TFNN server once a day (07:00 Windhoek) so farmers get their due-task email.
# Needs a repository secret named CRON_SECRET that matches CRON_SECRET on the Render service.
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Send reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET is not set - skipping"; exit 0; fi
          # the free server may be asleep, so allow a long first response and retry
          curl --fail-with-body -sS --retry 4 --retry-delay 20 --retry-all-errors --max-time 120 \
            -X POST -H "x-cron-secret: $CRON_SECRET" \
            https://tfnn-1.onrender.com/api/v1/jobs/task-reminders
